<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #register{color: white;}
        #h1{background-color: red;}
        html{background-color: rgb(176, 190, 147);}

    </style>
</head>
<body><center>
    <h1 id="h1" style="color: white;padding: 20px;">Registration form</h1></center>
    <div>
        <label for="firstname">First name:</label>
        <input type="text"  id="firstname" placeholder="your first name" required>

    </div><br>
    <div>
        <label for="lastname">Last name :</label>
        <input type="text" id="lastname" placeholder="your last name" required>
    </div><br>
    <div>
        <label for="campus">Campus :</label>
        <input type="text" readonly value="Sushant University" required>

    </div><br>
    <div>
        <label >Email:</label>
        <input type="email" placeholder="your email" required>
    </div><br>
    <div>
        <label >Password</label>
        <input type="password" placeholder="****"required min="5">
    </div><br>
    <div> 
        <label for="AGE">Age :</label>
        <input type="number" id="AGE"   placeholder="enter your age"  required min="0">
    </div><br>
    <div><label for="gender">Gender</label>
        <select  id="gender">Gender
            <option value="male">M</option>
            <option value="female">F</option>
            <option value="other">O</option>
        </select>
    </div><br>

    <div>
        <label for="DOB">DOB :</label>
        <input type="date" id="DOB" required>
    </div><br>
    <div>
        <label for="profile">Profile pic</label>
        <input type="file"  id="profile" required>
    </div><br><center>
    <button id="register" type="submit" style="background-color: blue;padding: 10px;">Register</button></center>
    


    
</body>
</html>
